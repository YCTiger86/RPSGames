<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K리그1 2026 시즌 전체 경기 기록</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>K리그1 2026 시즌 전체 경기 기록</h1>
      <p id="updatedAt" class="sub"></p>
      <p id="summary" class="summary"></p>

      <section class="filters">
        <input id="teamFilter" type="text" placeholder="팀명 검색" />
        <input id="roundFilter" type="text" placeholder="라운드 (예: 1R)" />
        <select id="statusFilter">
          <option value="">전체 상태</option>
          <option value="SCHEDULED">예정</option>
          <option value="IN_PLAY">진행중</option>
          <option value="FINISHED">종료</option>
        </select>
        <button id="refreshBtn">지금 새로고침</button>
      </section>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>일시</th>
              <th>라운드</th>
              <th>홈</th>
              <th>스코어</th>
              <th>원정</th>
              <th>경기장</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody id="matchesBody"></tbody>
        </table>
      </div>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
